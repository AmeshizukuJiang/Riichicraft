plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'riichicraft'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        riichicraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Compile the rules again in isolation: no Minecraft, Fabric or third-party test libraries.
sourceSets {
    rulesCore {
        java {
            srcDir 'src/main/java'
            include 'dev/riichicraft/rules/**'
            include 'dev/riichicraft/persistence/**'
            include 'dev/riichicraft/game/TileCatalog.java'
            include 'dev/riichicraft/table/TableWallLayout.java'
            include 'dev/riichicraft/table/TileMotion.java'
            include 'dev/riichicraft/table/TableHandVisibility.java'
        }
        compileClasspath = files()
        runtimeClasspath = output
    }
    rulesTest {
        java.srcDir 'src/rulesTest/java'
        compileClasspath = sourceSets.rulesCore.output
        runtimeClasspath = output + compileClasspath
    }
}

tasks.register('rulesTest', JavaExec) {
    group = 'verification'
    description = 'Verify the standalone rules without loading Minecraft or external test libraries.'
    dependsOn tasks.named('rulesTestClasses')
    classpath = sourceSets.rulesTest.runtimeClasspath
    mainClass = 'dev.riichicraft.rules.RulesTests'
    enableAssertions = true
}

tasks.named('check') {
    dependsOn tasks.named('rulesTest')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'riichicraft-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = providers.gradleProperty('riichicraft_accept_eula')
                .map { value -> value.toBoolean() }.getOrElse(false)
    }
}

def verifyDedicatedServer = providers.gradleProperty('verify_dedicated_server')
        .map { value -> value.toBoolean() }.getOrElse(false)
def testProjectRoot = layout.projectDirectory.asFile.absolutePath
// Reuse the exact historical core archives for server projection compatibility checks.
sourceSets.gametest.resources.srcDir('src/rulesTest/resources')
tasks.named('runGameTest', JavaExec) {
    systemProperty 'riichicraft.test.projectRoot', testProjectRoot
    systemProperty 'riichicraft.test.captureSnapshots', providers.gradleProperty('riichicraft_capture_snapshots')
            .map { value -> value.toBoolean() }.getOrElse(false)
}
tasks.named('runClientGameTest', JavaExec) {
    systemProperty 'riichicraft.test.dedicated', verifyDedicatedServer
    systemProperty 'riichicraft.test.projectRoot', testProjectRoot
    if (verifyDedicatedServer) {
        systemProperty 'java.awt.headless', true
    }
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
